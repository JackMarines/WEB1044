<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Contact Togo Travel about destinations and sample tours."
    />
    <title>Contact – Togo</title>
    <link rel="icon" type="image/svg+xml" href="assets/color.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Jost:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=20261022" />
  </head>
  <body data-page="contact">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" aria-label="Site header"></header>
    <main id="main" class="page-wrap interior-main">
      <div class="breadcrumb">
        <a href="index.html">Home</a><span aria-hidden="true">/</span
        ><span>Contact</span>
      </div>
      <section class="contact-layout">
        <div class="contact-copy">
          <p class="section-kicker">WE'RE HERE TO HELP</p>
          <h1>Get in touch<br />with our team.</h1>
          <p>
            Ask us about a destination or tour. We're happy to help you plan
            your next trip.
          </p>
          <div class="contact-details">
            <span>Coursework demo</span><span>Messages are not sent.</span>
            <span>Browse tours</span><a href="tours.html">View sample coastal tours</a>
          </div>
        </div>
        <form id="contact-form" class="form-panel form-stack" novalidate>
          <h2>Send us a message</h2>
          <div class="form-grid">
            <div class="field">
              <label for="contact-name">Full name</label
              ><input
                id="contact-name"
                name="name"
                autocomplete="name"
                required
              /><span class="field-error" data-error-for="name"></span>
            </div>
            <div class="field">
              <label for="contact-email">Email address</label
              ><input
                id="contact-email"
                name="email"
                type="email"
                autocomplete="email"
                required
              /><span class="field-error" data-error-for="email"></span>
            </div>
            <div class="field field--wide">
              <label for="contact-phone">Phone number</label
              ><input
                id="contact-phone"
                name="phone"
                type="tel"
                autocomplete="tel"
                required
              /><span class="field-error" data-error-for="phone"></span>
            </div>
            <div class="field field--wide">
              <label for="contact-message">Message</label
              ><textarea
                id="contact-message"
                name="message"
                rows="6"
                maxlength="500"
                required
              ></textarea>
              <div class="message-meter">
                <span class="field-error" data-error-for="message"></span
                ><span id="message-count" aria-live="polite">0 / 500</span>
              </div>
            </div>
          </div>
          <p id="contact-status" class="form-message" role="status"></p>
          <div class="form-actions">
            <button class="togo-pill togo-pill--orange" type="submit">
              Send message <span aria-hidden="true">↗</span></button
            ><button class="text-button" type="reset">Clear form</button>
          </div>
        </form>
      </section>
    </main>
    <footer class="site-footer"></footer>
    <div class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="tour-data.js?v=20261022"></script>
    <script src="state.js?v=20261022"></script>
    <script src="js/shared.js?v=20261022"></script>
    <script src="js/site.js?v=20261022"></script>
    <script src="js/contact-about.js?v=20261022"></script>
    <script src="app.js?v=20261022"></script>
  </body>
</html>
